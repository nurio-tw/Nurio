    <meta property="og:title" content="NURIO. - 全臺灣護理學生的實習交流平台" />
    <meta property="og:description" content="全臺灣護理學生的實習交流平台。快速查詢各專科實習指導風格、學理考核要點、常態給分與學長姐心得回饋。" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

  <body style="margin: 0; background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff;">
        <div style="width: 76px; height: 76px; margin-bottom: 20px; border-radius: 22px; border: 1px solid #FFE4E6; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px -6px rgba(244, 63, 94, 0.2); background: #ffffff; animation: nurioFloat 2.5s ease-in-out infinite;">
          <img src="/favicon.svg" alt="NURIO" style="width: 52px; height: 52px;" />
        </div>
        <div style="font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: #0f172a;">
          NURIO<span style="color: #f43f5e; display: inline-block; animation: nurioDotPulse 1.5s infinite;">.</span>
        </div>
        <div style="font-size: 13px; color: #64748b; margin-top: 6px; font-weight: 500;">
          全臺灣護理學生的實習交流平台
        </div>
        <style>
          @keyframes nurioFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
          }
          @keyframes nurioDotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
